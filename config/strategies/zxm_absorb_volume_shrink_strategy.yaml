strategy:
  id: ZXM_ABSORB_VOLUME_SHRINK_20240512
  name: "ZXM吸筹+缩量选股策略"
  description: "基于30分钟ZXM吸筹信号和日线缩量信号的选股策略，针对2024年5月12日"
  author: "system"
  version: "1.0"
  create_time: "2024-05-12 09:30:00"
  update_time: "2024-05-12 09:30:00"
  
  # 策略条件：30分钟ZXM吸筹信号 AND 日线缩量信号
  conditions:
    # 30分钟时间框架下的ZXM吸筹信号
    - type: indicator
      indicator_id: ZXM_BS_ABSORB
      period: "30min"
      signal_type: BUY
      parameter: "zxm_bs_absorb_signal"
      operator: "="
      value: 1
      description: "30分钟时间框架下出现ZXM主力吸筹信号"
    
    # 逻辑连接符
    - logic: AND
    
    # 日线时间框架下的缩量信号
    - type: indicator
      indicator_id: ZXM_VOLUME_SHRINK
      period: "DAILY"
      signal_type: BUY
      parameter: "zxm_volume_shrink_signal"
      operator: "="
      value: 1
      description: "日线时间框架下出现缩量信号（成交量相比2日均量缩减10%以上）"
  
  # 基础过滤条件
  filters:
    # 市场范围
    market: ["主板", "创业板", "科创板"]
    
    # 行业过滤（空表示不限制）
    industry: []
    
    # 市值范围（亿元）
    market_cap:
      min: 10
      max: 5000
    
    # 价格范围（元）
    price:
      min: 3.0
      max: 200.0
    
    # 成交量过滤（最小日均成交量）
    volume:
      min_avg_volume: 1000000
  
  # 排序规则
  sort:
    - field: "zxm_absorb_strength"
      direction: "DESC"
    - field: "volume_shrink_ratio"
      direction: "ASC"
    - field: "market_cap"
      direction: "ASC"
  
  # 策略参数
  parameters:
    # ZXM吸筹指标参数
    zxm_absorb:
      v11_threshold: 13
      v12_threshold: 13
      count_period: 6
    
    # 缩量指标参数
    volume_shrink:
      ma_period: 2
      shrink_threshold: 0.9
    
    # 时间参数
    target_date: "2024-05-12"
    
    # 结果限制
    max_results: 100
