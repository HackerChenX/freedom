# 策略组合配置文件
# 支持多种策略组合方式，实现灵活的选股策略

# 1. 技术指标组合策略
technical_momentum_combo:
  name: "技术动量组合策略"
  description: "结合KDJ、MACD、RSI三大技术指标的动量策略"
  version: "1.0"
  category: "momentum"
  
  strategies:
    - strategy_id: "KDJ_ALL_LINES_UPWARD_strategy"
      weight: 0.4
      priority: 1
      required: true
    - strategy_id: "macd_golden_cross_strategy"
      weight: 0.35
      priority: 2
      required: false
    - strategy_id: "rsi_oversold_strategy"
      weight: 0.25
      priority: 3
      required: false
  
  combination_method: "weighted_average"  # union, intersection, weighted_average
  
  selection_parameters:
    max_selections: 30
    min_score: 0.65
    diversification:
      max_per_industry: 3
      max_concentration: 0.15

# 2. ZXM专业策略组合
zxm_professional_combo:
  name: "ZXM专业策略组合"
  description: "基于ZXM体系的专业选股策略组合"
  version: "1.0"
  category: "professional"
  
  strategies:
    - strategy_id: "zxm_60min_absorb_20250512"
      weight: 0.5
      priority: 1
      required: true
    - strategy_id: "zxm_absorb_volume_shrink_strategy"
      weight: 0.3
      priority: 2
      required: false
    - strategy_id: "zxm_kdj_strategy_20250512"
      weight: 0.2
      priority: 3
      required: false
  
  combination_method: "intersection"
  
  selection_parameters:
    max_selections: 20
    min_score: 0.7
    diversification:
      max_per_industry: 2
      max_concentration: 0.1

# 3. 趋势反转策略组合
trend_reversal_combo:
  name: "趋势反转策略组合"
  description: "捕捉趋势反转机会的策略组合"
  version: "1.0"
  category: "reversal"
  
  strategies:
    - strategy_id: "trend_reversal"
      weight: 0.6
      priority: 1
      required: true
    - strategy_id: "rsi_oversold_strategy"
      weight: 0.4
      priority: 2
      required: false
  
  combination_method: "union"
  
  selection_parameters:
    max_selections: 25
    min_score: 0.6
    diversification:
      max_per_industry: 4
      max_concentration: 0.2

# 4. 保守稳健策略组合
conservative_stable_combo:
  name: "保守稳健策略组合"
  description: "适合保守投资者的稳健策略组合"
  version: "1.0"
  category: "conservative"
  
  strategies:
    - strategy_id: "KDJ_ALL_LINES_UPWARD_strategy"
      weight: 0.3
      priority: 1
      required: true
    - strategy_id: "macd_golden_cross_strategy"
      weight: 0.3
      priority: 1
      required: true
    - strategy_id: "rsi_oversold_strategy"
      weight: 0.2
      priority: 2
      required: false
    - strategy_id: "trend_reversal"
      weight: 0.2
      priority: 3
      required: false
  
  combination_method: "intersection"
  
  selection_parameters:
    max_selections: 15
    min_score: 0.75
    diversification:
      max_per_industry: 2
      max_concentration: 0.08
  
  risk_control:
    enable_stop_loss: true
    stop_loss_threshold: 0.05
    max_drawdown: 0.1
    position_sizing: "equal_weight"

# 5. 激进成长策略组合
aggressive_growth_combo:
  name: "激进成长策略组合"
  description: "追求高收益的激进策略组合"
  version: "1.0"
  category: "aggressive"
  
  strategies:
    - strategy_id: "zxm_60min_absorb_20250512"
      weight: 0.4
      priority: 1
      required: false
    - strategy_id: "KDJ_ALL_LINES_UPWARD_strategy"
      weight: 0.3
      priority: 2
      required: false
    - strategy_id: "trend_reversal"
      weight: 0.3
      priority: 3
      required: false
  
  combination_method: "union"
  
  selection_parameters:
    max_selections: 50
    min_score: 0.5
    diversification:
      max_per_industry: 8
      max_concentration: 0.3

# 6. 自定义策略模板
custom_strategy_template:
  name: "自定义策略模板"
  description: "用户可以基于此模板创建自定义策略组合"
  version: "1.0"
  category: "custom"
  
  strategies:
    - strategy_id: "your_strategy_1"
      weight: 0.5
      priority: 1
      required: true
      parameters:
        # 可以为每个子策略设置特定参数
        custom_param1: "value1"
        custom_param2: 100
    - strategy_id: "your_strategy_2"
      weight: 0.3
      priority: 2
      required: false
    - strategy_id: "your_strategy_3"
      weight: 0.2
      priority: 3
      required: false
  
  combination_method: "weighted_average"
  
  selection_parameters:
    max_selections: 30
    min_score: 0.6
    ranking_method: "composite"
    diversification:
      max_per_industry: 3
      max_concentration: 0.15
  
  # 高级配置选项
  advanced_options:
    enable_dynamic_weighting: true
    rebalance_frequency: "daily"
    market_condition_adjustment: true
    sector_rotation: false
  
  # 回测配置
  backtest_config:
    lookback_period: 252  # 一年
    benchmark: "000300"   # 沪深300
    transaction_cost: 0.003
    slippage: 0.001

# 全局配置
global_settings:
  default_combination_method: "weighted_average"
  max_strategies_per_combo: 5
  enable_performance_tracking: true
  cache_results: true
  parallel_execution: true
  max_workers: 4
  
  # 风险管理
  global_risk_limits:
    max_single_stock_weight: 0.1
    max_sector_weight: 0.3
    min_diversification_score: 0.7
  
  # 性能监控
  performance_thresholds:
    min_success_rate: 0.6
    max_execution_time: 300  # 秒
    alert_on_failure: true
