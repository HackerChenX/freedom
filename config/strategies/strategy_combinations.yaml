# 策略组合配置文件
# 支持多种策略组合方式，实现灵活的选股策略

# 1. 技术指标组合策略
technical_momentum_combo:
  name: "技术动量组合策略"
  description: "结合KDJ、MACD、RSI三大技术指标的动量策略"
  version: "1.0"
  category: "momentum"
  
  strategies:
    - strategy_id: "KDJ_ALL_LINES_UPWARD_strategy"
      weight: 0.4
      priority: 1
      required: true
    - strategy_id: "macd_golden_cross_strategy"
      weight: 0.35
      priority: 2
      required: false
    - strategy_id: "rsi_oversold_strategy"
      weight: 0.25
      priority: 3
      required: false
  
  combination_method: "weighted_average"  # union, intersection, weighted_average
  
  selection_parameters:
    max_selections: 30
    min_score: 0.65
    diversification:
      max_per_industry: 3
      max_concentration: 0.15

# 2. ZXM专业策略组合（修复版）
zxm_professional_combo:
  name: "ZXM专业策略组合"
  description: "基于ZXM体系的专业选股策略组合（修复版）"
  version: "1.1"
  category: "professional"

  strategies:
    - strategy_id: "ZXM_60MIN_ABSORB_20250512"
      weight: 0.5
      priority: 1
      required: true
    - strategy_id: "ZXM_ABSORB_VOLUME_SHRINK_20240512"
      weight: 0.3
      priority: 2
      required: false
    - strategy_id: "ZXM_KDJ_STRATEGY_20250512"
      weight: 0.2
      priority: 3
      required: false

  combination_method: "union"  # 改为union以增加选股数量

  selection_parameters:
    max_selections: 30
    min_score: 0.5  # 降低最小分数要求
    diversification:
      max_per_industry: 3
      max_concentration: 0.15

# 3. 趋势反转策略组合
trend_reversal_combo:
  name: "趋势反转策略组合"
  description: "捕捉趋势反转机会的策略组合"
