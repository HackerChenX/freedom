      weight: 0.4
      priority: 1
      required: false
    - strategy_id: "KDJ_ALL_LINES_UPWARD_strategy"
      weight: 0.3
      priority: 2
      required: false
    - strategy_id: "trend_reversal"
      weight: 0.3
      priority: 3
      required: false
  
  combination_method: "union"
  
