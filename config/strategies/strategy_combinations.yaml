# 全局配置
global_settings:
  default_combination_method: "weighted_average"
  max_strategies_per_combo: 5
  enable_performance_tracking: true
  cache_results: true
  parallel_execution: true
  max_workers: 8  # 增加并行处理能力

  # 风险管理
  global_risk_limits:
    max_single_stock_weight: 0.08
    max_sector_weight: 0.25
    min_diversification_score: 0.75

  # 性能监控
  performance_thresholds:
    min_success_rate: 0.65
    max_execution_time: 600  # 增加到10分钟，支持复杂计算
    alert_on_failure: true

