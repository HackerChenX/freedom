    min_score: 0.6
    diversification:
      max_per_industry: 4
      max_concentration: 0.2

# 4. 保守稳健策略组合
conservative_stable_combo:
  name: "保守稳健策略组合"
  description: "适合保守投资者的稳健策略组合"
  version: "1.0"
  category: "conservative"
  
  strategies:
    - strategy_id: "KDJ_ALL_LINES_UPWARD_strategy"
      weight: 0.3
      priority: 1
      required: true
    - strategy_id: "macd_golden_cross_strategy"
      weight: 0.3
      priority: 1
      required: true
    - strategy_id: "rsi_oversold_strategy"
      weight: 0.2
      priority: 2
      required: false
    - strategy_id: "trend_reversal"
      weight: 0.2
      priority: 3
      required: false
  
  combination_method: "intersection"
  
  selection_parameters:
    max_selections: 15
    min_score: 0.75
    diversification:
      max_per_industry: 2
      max_concentration: 0.08
  
  risk_control:
    enable_stop_loss: true
    stop_loss_threshold: 0.05
    max_drawdown: 0.1
    position_sizing: "equal_weight"

# 5. 激进成长策略组合
aggressive_growth_combo:
  name: "激进成长策略组合"
  description: "追求高收益的激进策略组合"
