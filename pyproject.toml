[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["indicators", "db", "utils", "tools", "tests"]
known_third_party = ["pandas", "numpy", "clickhouse_driver", "pytest"]

[tool.autopep8]
max_line_length = 120
ignore = "E203,W503"
in-place = true
recursive = true
aggressive = 1
