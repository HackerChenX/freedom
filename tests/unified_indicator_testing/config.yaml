    # ZXM体系指标（37个）- 声明100%完美通过率
    ZXM_WEEKLY_MACD:
      patterns: ['WEEKLY_GOLDEN_CROSS', 'WEEKLY_DEATH_CROSS', 'WEEKLY_DIVERGENCE']
      history_requirement: 60
