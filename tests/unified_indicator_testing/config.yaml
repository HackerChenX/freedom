# 统一指标测试配置文件

test_framework:
  version: "1.0.0"
  strict_mode: true  # 严格模式：要求100%通过率
  timeout_seconds: 600
  max_parallel_tests: 10
  retry_on_failure: false  # 不重试，确保测试严格性

data_generation:
  default_history_days: 250
  stockinfo_compatibility: true
  data_quality_threshold: 0.95
  pool_size: 100  # 每个测试的数据池大小

# 复测验证配置 - 所有声明为100%通过测试的指标
indicators_test_matrix:
  completed_indicators:
    # 第一批核心指标中标记为100%完美的13个指标
    KDJ:
      patterns: ['GOLDEN_CROSS', 'DEATH_CROSS', 'OVERBOUGHT', 'OVERSOLD']
      history_requirement: 20
      complex_conditions: ['KDJ_MACD_COMBO', 'KDJ_VOL_COMBO']
      expected_accuracy: 1.0
      priority: "high"
      status: "claimed_100_percent"

    DMI:
      patterns: ['ADX_RISING', 'DI_CROSS', 'TREND_STRENGTH']
      history_requirement: 30
      complex_conditions: ['DMI_MACD_COMBO']
      expected_accuracy: 1.0
      priority: "medium"
      status: "claimed_100_percent"

    ADX:
      patterns: ['TREND_STRENGTH', 'TREND_WEAKNESS', 'DIRECTIONAL_CHANGE']
      history_requirement: 30
      complex_conditions: ['ADX_DMI_COMBO']
      expected_accuracy: 1.0
      priority: "medium"
      status: "claimed_100_percent"

    DMA:
