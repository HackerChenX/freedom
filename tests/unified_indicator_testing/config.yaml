# 性能测试要求
performance_requirements:
  max_execution_time_per_indicator: 120  # 秒
  max_memory_usage: "2GB"
  min_throughput: 1000  # 股票/秒
  large_scale_test_size: 4000  # 模拟4000+股票

# 验证标准
validation_criteria:
  buypoint_recognition_accuracy: 1.0
  selection_precision: 0.95
  selection_recall: 0.90
  closed_loop_validation_rate: 1.0

# 复杂条件组合测试配置
complex_condition_tests:
  multi_indicator_combinations:
    - ['MACD', 'RSI']
    - ['KDJ', 'BOLL']
    - ['MA', 'VOL']
    - ['DMI', 'ADX']
    - ['SAR', 'TRIX']  # 🔧 新增组合
    - ['MFI', 'ROC']   # 🔧 新增组合
    - ['ATR', 'KC']    # 🔧 新增组合
  
  multi_timeframe_combinations:
    - ['daily', '60min']
    - ['daily', '30min']
    - ['60min', '30min']
  
  logic_operators:
    - 'AND'
    - 'OR'
    - 'NOT'
    - 'XOR'

# 选股脚本配置
stock_selection:
  script_path: "bin/stock_select.py"
  mock_data_mode: true
  default_filters:
    market_cap:
      min: 10
      max: 5000
    price_range:
      min: 3.0
      max: 200.0
    volume_filter:
      min_avg_volume: 1000000
  
  strategy_template:
    time_criteria:
      time_frames:
        - level: "daily"
          priority: 1
          required: true
      market_timing:
        trading_session: "full_day"
        exclude_holidays: true
    
    selection_parameters:
      max_selections: 50
      min_score: 0.6
      ranking_method: "score"
    
    validation:
      enable_closed_loop: true
      validation_method: "entry_point_analysis"
      validation_threshold: 0.8

# 报告配置
reporting:
  output_directory: "test_reports"
  formats: ["markdown", "json", "html"]
  include_charts: true
  real_time_monitoring: true
  
  alert_thresholds:
    memory_usage: 0.8
    execution_time: 300
    pass_rate: 1.0

# 日志配置
logging:
  level: "INFO"
  file: "logs/unified_indicator_test.log"
  max_size_mb: 100
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
