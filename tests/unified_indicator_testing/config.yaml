# 复测验证配置 - 仅包含需要验证的指标
  # 注意：ZXM体系指标由于数量众多（37个），在此简化为代表性指标
  # 实际复测时会包含完整的ZXM体系

# 复测验证配置
verification_config:
  test_iterations: 20  # 每个指标执行20次连续测试
  success_rate_requirement: 1.0  # 100%准确率要求
  max_response_time_ms: 100  # 响应时间<100ms
  max_memory_usage_mb: 50  # 内存使用<50MB

  # 复测分组
  test_groups:
    group_1_core_indicators:
      - KDJ
      - DMI
      - ADX
      - DMA
      - CCI
    group_2_technical_indicators:
      - BIAS
      - STOCHRSI
      - WR
      - OBV
      - MTM
    group_3_momentum_indicators:
      - PVT
      - MOMENTUM
      - AROON
    group_4_ultra_think_batch1:
      - ATR
      - SAR
      - MFI
      - ROC
      - CMO
    group_5_ultra_think_batch2:
      - PSY
      - VR
      - EMV
      - TRIX
      - CHAIKIN
    group_6_ultra_think_batch3:
      - VIX
      - KC
      - VORTEX
      - AD
    group_7_zxm_sample:
      - ZXM_WEEKLY_MACD
      - ZXM_MONTHLY_MACD
      - ZXM_TREND_SCORE
      - ZXM_MARKET_SENTIMENT
      - ZXM_FUND_FLOW

# 性能测试要求
performance_requirements:
  max_execution_time_per_indicator: 120  # 秒
  max_memory_usage: "2GB"
  min_throughput: 1000  # 股票/秒
  large_scale_test_size: 4000  # 模拟4000+股票

# 验证标准
validation_criteria:
  buypoint_recognition_accuracy: 1.0
  selection_precision: 0.95
  selection_recall: 0.90
  closed_loop_validation_rate: 1.0

# 复杂条件组合测试配置
complex_condition_tests:
  multi_indicator_combinations:
    - ['MACD', 'RSI']
    - ['KDJ', 'BOLL']
    - ['MA', 'VOL']
    - ['DMI', 'ADX']
    - ['SAR', 'TRIX']  # 🔧 新增组合
    - ['MFI', 'ROC']   # 🔧 新增组合
    - ['ATR', 'KC']    # 🔧 新增组合
  
  multi_timeframe_combinations:
    - ['daily', '60min']
    - ['daily', '30min']
    - ['60min', '30min']
  
  logic_operators:
    - 'AND'
    - 'OR'
    - 'NOT'
    - 'XOR'

# 选股脚本配置
stock_selection:
  script_path: "bin/stock_select.py"
  mock_data_mode: true
  default_filters:
    market_cap:
      min: 10
      max: 5000
    price_range:
      min: 3.0
      max: 200.0
    volume_filter:
      min_avg_volume: 1000000
  
  strategy_template:
    time_criteria:
      time_frames:
        - level: "daily"
          priority: 1
          required: true
      market_timing:
        trading_session: "full_day"
        exclude_holidays: true
    
    selection_parameters:
      max_selections: 50
      min_score: 0.6
      ranking_method: "score"
    
    validation:
      enable_closed_loop: true
      validation_method: "entry_point_analysis"
      validation_threshold: 0.8

# 报告配置
reporting:
  output_directory: "test_reports"
  formats: ["markdown", "json", "html"]
  include_charts: true
  real_time_monitoring: true
  
  alert_thresholds:
    memory_usage: 0.8
    execution_time: 300
    pass_rate: 1.0

# 日志配置
logging:
  level: "INFO"
  file: "logs/unified_indicator_test.log"
  max_size_mb: 100
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
