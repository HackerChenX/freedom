logging:
  backup_count: 5
  file: logs/production_indicator_test.log
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  level: INFO
  max_size_mb: 100
performance_requirements:
  max_execution_time_per_indicator: 120
  max_memory_usage_mb: 100
  min_throughput: 1000
  response_time_ms: 100
reporting:
  alert_thresholds:
    execution_time: 300
    memory_usage: 0.8
    pass_rate: 1.0
  formats:
  - markdown
  - json
  - html
  include_charts: true
  output_directory: test_reports
  progress_tracking: true
  real_time_monitoring: true
test_framework:
  max_retries: 3
  parallel_execution: false
  quality_threshold: 1.0
  strict_mode: true
  timeout_seconds: 600
validation_criteria:
  architecture_compliance_rate: 1.0
  buypoint_recognition_accuracy: 1.0
  closed_loop_validation_rate: 1.0
  selection_precision: 0.95
  selection_recall: 0.9
