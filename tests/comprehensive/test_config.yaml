# 综合选股测试系统配置文件
test_config:
  # 执行配置
  execution:
    timeout_seconds: 300      # 5分钟超时
    performance_threshold: 0.8  # 80%时触发性能优化
    max_workers: 20           # 最大并行工作线程
    batch_size: 1000          # 批处理大小
  
  # 数据库配置
  database:
    clickhouse:
      connection_pool_size: 50
      query_timeout: 30
      batch_size: 1000
      compression: true
  
  # 测试范围配置
  test_scope:
    date_range:
      start_date: "20240101"  # 测试开始日期
      end_date: "20241231"    # 测试结束日期
    stock_universe: "ALL"     # 股票池：ALL/INDEX/CUSTOM
    min_volume: 1000000       # 最小成交量过滤
    min_price: 1.0            # 最小价格过滤
  
  # 验证配置
  verification:
    confidence_threshold: 0.7       # 置信度阈值
    pattern_match_threshold: 0.8    # 形态匹配阈值
    require_at_least_one_stock: true  # 每个形态至少选出一只股票
  
  # 报告配置
  reporting:
    output_formats:
      - "json"
      - "html"
      - "csv"
    detail_level: "comprehensive"  # 报告详细程度
    include_diagnostics: true      # 包含诊断信息
    export_selected_stocks: true   # 导出选中的股票
    export_verification_details: true  # 导出验证详情
  
  # 优化配置
  optimization:
    enable_caching: true      # 启用缓存
    cache_ttl: 3600          # 缓存TTL（秒）
    enable_early_stopping: true  # 启用早停
    memory_limit_mb: 8192     # 8GB内存限制
    gc_threshold: 0.8        # GC阈值
  
  # 指标过滤（可选）
  # 如果指定，则只测试这些指标
  # indicators_to_test:
  #   - "MA"
  #   - "MACD"
  #   - "KDJ"
  #   - "RSI"
  
  # 形态过滤（可选）
  # 如果指定，则只测试这些形态
  # patterns_to_test:
  #   - "MA_GOLDEN_CROSS"
  #   - "MACD_GOLDEN_CROSS"
  #   - "KDJ_OVERSOLD"