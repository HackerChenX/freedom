# CI/CD Pipeline for Freedom Stock Analysis System
name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop, feat/* ]
  pull_request:
    branches: [ master, develop ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: freedom-stock-analysis
  PROCESSOR_IMAGE_NAME: freedom-data-processor

jobs:
  # ============================================================================
  # Code Quality and Testing
  # ============================================================================
  test:
    name: Run Tests and Code Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10]

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:23.8
        ports:
          - 8123:8123
          - 9000:9000
        env:
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
          CLICKHOUSE_PASSWORD: test_password
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/?query=SELECT%201"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov black flake8 isort safety bandit

    - name: Code formatting check (Black)
      run: |
        black --check --line-length 120 analysis/ indicators/ utils/ db/ api/ strategy/ monitoring/ --diff

    - name: Import sorting check (isort)
      run: |
        isort --check-only --profile black analysis/ indicators/ utils/ db/ api/ strategy/ monitoring/

    - name: Lint with flake8
      run: |
        flake8 analysis/ indicators/ utils/ db/ api/ strategy/ monitoring/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 analysis/ indicators/ utils/ db/ api/ strategy/ monitoring/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Security check with bandit
      run: |
        bandit -r analysis/ indicators/ utils/ db/ api/ strategy/ monitoring/ -f json -o bandit-report.json || true

    - name: Dependency security check
      run: |
        safety check --json --output safety-report.json || true

    - name: Run unit tests
      env:
        CLICKHOUSE_HOST: localhost
        CLICKHOUSE_PORT: 8123
        CLICKHOUSE_PASSWORD: test_password
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m pytest tests/ -v --cov=analysis --cov=indicators --cov=utils --cov=db --cov=api --cov=strategy --cov=monitoring --cov-report=xml --cov-report=html --cov-report=term-missing

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

    - name: Upload test artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-reports
        path: |
          coverage.xml
          htmlcov/
          bandit-report.json
          safety-report.json

  # ============================================================================
  # Build Docker Images
  # ============================================================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      processor-tag: ${{ steps.processor-meta.outputs.tags }}
      processor-digest: ${{ steps.processor-build.outputs.digest }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Build main application image
    - name: Extract metadata for main image
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,prefix={{branch}}-

    - name: Build and push main image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

    # Build data processor image
    - name: Extract metadata for processor image
      id: processor-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.PROCESSOR_IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,prefix={{branch}}-

    - name: Build and push processor image
      id: processor-build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.processor
        push: true
        tags: ${{ steps.processor-meta.outputs.tags }}
        labels: ${{ steps.processor-meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

    # Sign the images with cosign
    - name: Install cosign
      if: github.event_name != 'pull_request'
      uses: sigstore/cosign-installer@v3
      with:
        cosign-release: 'v2.1.1'

    - name: Sign main image
      if: github.event_name != 'pull_request'
      env:
        COSIGN_EXPERIMENTAL: 1
      run: echo "${{ steps.meta.outputs.tags }}" | xargs -I {} cosign sign --yes {}@${{ steps.build.outputs.digest }}

    - name: Sign processor image
      if: github.event_name != 'pull_request'
      env:
        COSIGN_EXPERIMENTAL: 1
      run: echo "${{ steps.processor-meta.outputs.tags }}" | xargs -I {} cosign sign --yes {}@${{ steps.processor-build.outputs.digest }}

  # ============================================================================
  # Deploy to Development
  # ============================================================================
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feat/')
    environment: development

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Configure kubectl
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.DEV_KUBECONFIG }}" | base64 --decode > ~/.kube/config
        kubectl config use-context development

    - name: Deploy to development
      run: |
        # Update image tags in development overlay
        cd k8s/overlays/dev
        kustomize edit set image freedom-stock-analysis=${{ needs.build.outputs.image-tag }}
        kustomize edit set image freedom-data-processor=${{ needs.build.outputs.processor-tag }}

        # Apply the configuration
        kubectl apply -k .

        # Wait for rollout to complete
        kubectl rollout status deployment/api-service -n freedom-stock-dev --timeout=300s
        kubectl rollout status deployment/data-processor -n freedom-stock-dev --timeout=300s

    - name: Run smoke tests
      run: |
        # Wait for pods to be ready
        kubectl wait --for=condition=Ready pod -l app=api-service -n freedom-stock-dev --timeout=300s

        # Get service URL
        API_URL=$(kubectl get svc nginx-lb-service -n freedom-stock-dev -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

        # Run smoke tests
        curl -f http://$API_URL/health || exit 1
        curl -f http://$API_URL/info || exit 1

  # ============================================================================
  # Deploy to Staging
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/master'
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Configure kubectl
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 --decode > ~/.kube/config
        kubectl config use-context staging

    - name: Deploy to staging
      run: |
        # Update image tags in staging overlay
        cd k8s/overlays/staging
        kustomize edit set image freedom-stock-analysis=${{ needs.build.outputs.image-tag }}
        kustomize edit set image freedom-data-processor=${{ needs.build.outputs.processor-tag }}

        # Apply the configuration
        kubectl apply -k .

        # Wait for rollout to complete
        kubectl rollout status deployment/api-service -n freedom-stock-staging --timeout=600s
        kubectl rollout status deployment/data-processor -n freedom-stock-staging --timeout=600s

    - name: Run integration tests
      run: |
        # Wait for pods to be ready
        kubectl wait --for=condition=Ready pod -l app=api-service -n freedom-stock-staging --timeout=600s

        # Run comprehensive integration tests
        python tests/integration/test_full_system.py --environment=staging

  # ============================================================================
  # Deploy to Production
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build, deploy-staging]
    if: github.event_name == 'release'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Configure kubectl
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.PROD_KUBECONFIG }}" | base64 --decode > ~/.kube/config
        kubectl config use-context production

    - name: Pre-deployment health check
      run: |
        # Check current system health
        kubectl get pods -n freedom-stock-prod
        kubectl top pods -n freedom-stock-prod

    - name: Deploy to production
      run: |
        # Update image tags in production overlay
        cd k8s/overlays/prod
        kustomize edit set image freedom-stock-analysis=${{ needs.build.outputs.image-tag }}
        kustomize edit set image freedom-data-processor=${{ needs.build.outputs.processor-tag }}

        # Apply the configuration with rolling update
        kubectl apply -k .

        # Wait for rollout to complete (extended timeout for production)
        kubectl rollout status deployment/api-service -n freedom-stock-prod --timeout=900s
        kubectl rollout status deployment/data-processor -n freedom-stock-prod --timeout=900s

    - name: Post-deployment verification
      run: |
        # Wait for all pods to be ready
        kubectl wait --for=condition=Ready pod -l app=api-service -n freedom-stock-prod --timeout=600s

        # Get service URL
        API_URL=$(kubectl get svc nginx-lb-service -n freedom-stock-prod -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

        # Run production health checks
        curl -f http://$API_URL/health || exit 1
        curl -f http://$API_URL/info || exit 1

        # Run production smoke tests
        python tests/production/smoke_tests.py --url=http://$API_URL

    - name: Notify deployment success
      if: success()
      run: |
        echo "Production deployment successful!"
        echo "Version: ${{ github.event.release.tag_name }}"
        echo "Commit: ${{ github.sha }}"

    - name: Rollback on failure
      if: failure()
      run: |
        echo "Production deployment failed, initiating rollback..."
        kubectl rollout undo deployment/api-service -n freedom-stock-prod
        kubectl rollout undo deployment/data-processor -n freedom-stock-prod
        kubectl rollout status deployment/api-service -n freedom-stock-prod --timeout=300s
        kubectl rollout status deployment/data-processor -n freedom-stock-prod --timeout=300s

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ needs.build.outputs.image-tag }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run Snyk to check Docker image for vulnerabilities
      uses: snyk/actions/docker@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        image: ${{ needs.build.outputs.image-tag }}
        args: --severity-threshold=high --file=Dockerfile

  # ============================================================================
  # Performance Testing
  # ============================================================================
  performance-test:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/master'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install locust pytest-benchmark

    - name: Run performance tests
      run: |
        # Run load tests against staging environment
        python tests/performance/load_test.py --environment=staging

    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: performance-results.json