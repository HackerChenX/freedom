version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    ports:
      - "8123:8123"  # HTTP接口
      - "9000:9000"  # 原生TCP接口
      - "9004:9004"  # MySQL兼容接口
    environment:
      # 设置默认用户密码
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: 123456
    volumes:
      # 数据持久化
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      # 自定义配置文件
      - ./config/clickhouse/users.xml:/etc/clickhouse-server/users.d/custom-users.xml
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/?query=SELECT%201"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  clickhouse_data:
  clickhouse_logs:
