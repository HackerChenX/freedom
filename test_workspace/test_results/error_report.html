
        <!DOCTYPE html>
        <html>
        <head>
            <title>错误分析报告</title>
            <style>
                body { font-family: Arial, sans-serif; margin: 20px; }
                h1, h2 { color: #333; }
                table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
                th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
                th { background-color: #f2f2f2; }
                tr:nth-child(even) { background-color: #f9f9f9; }
                .error-message { color: #d9534f; }
            </style>
        </head>
        <body>
            <h1>错误分析报告</h1>
            <p>分析时间范围: 过去7天</p>
            <p>总错误数: 0</p>
            
            <h2>错误类型分布</h2>
            <table>
                <tr>
                    <th>错误类型</th>
                    <th>数量</th>
                </tr>
        
            </table>
            
            <h2>错误上下文分布</h2>
            <table>
                <tr>
                    <th>错误上下文</th>
                    <th>数量</th>
                </tr>
        
            </table>
            
            <h2>最近错误详情</h2>
            <table>
                <tr>
                    <th>时间</th>
                    <th>类型</th>
                    <th>上下文</th>
                    <th>错误信息</th>
                </tr>
        
            </table>
        </body>
        </html>
