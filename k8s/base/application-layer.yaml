        imagePullPolicy: Always
        command: ["python", "monitoring/market_monitor.py"]
        env:
        - name: CLICKHOUSE_HOST
          value: "clickhouse-primary-service"
        - name: CLICKHOUSE_PORT
          value: "8123"
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: CLICKHOUSE_USER
          valueFrom:
            secretKeyRef:
              name: freedom-secrets
              key: CLICKHOUSE_USER
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: freedom-secrets
              key: CLICKHOUSE_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: freedom-secrets
              key: REDIS_PASSWORD
        envFrom:
